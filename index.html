<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Pemesanan Aplikasi Kelana</title>
<!--
  FORM PERMINTAAN LISENSI KELANA (berkas HTML terpisah)
  =====================================================
  Berkas ini adalah formulir publiknya. Ia berbicara ke backend
  Google Apps Script (Code.gs) lewat JSONP, jadi berkas ini bisa
  dibuka langsung dari laptop (klik ganda) atau di-host statis
  (mis. GitHub Pages) — tidak perlu server sendiri.

  WEBAPP_URL di bawah sudah diisi dengan URL Web app Bapak.
  URL ini TETAP SAMA selama pembaruan Code.gs di-deploy sebagai
  versi baru dari deployment yang sama (Deploy > Manage
  deployments > edit > New version). Bila Bapak membuat deployment
  baru (bukan versi baru), URL berubah dan harus diperbarui di sini.
-->
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#eef7f2;margin:0;padding:18px 12px;color:#1f2937;min-height:100vh;font-size:15px}
.kartu{max-width:600px;margin:0 auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 16px 40px rgba(15,118,110,.20);border:1px solid #d1fae5}
.kepala{background:linear-gradient(135deg,#065f46,#0f766e 55%,#15803d);padding:28px 24px 22px;color:#fff;position:relative}
.kepala:after{content:"";position:absolute;right:18px;top:16px;font-size:52px;opacity:.25}
.kepala h1{margin:0;font-size:clamp(18px,5.2vw,24px);line-height:1.25;letter-spacing:0;white-space:nowrap}
.kepala p{margin:10px 0 0;font-size:14px;line-height:1.5;opacity:.92}
.lencana{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.isi{padding:8px 24px 20px}
h2{font-size:15px;color:#065f46;margin:26px 0 2px;padding-bottom:8px;border-bottom:2px solid #d1fae5}
label{display:block;font-size:14px;font-weight:700;color:#065f46;margin:14px 0 6px}
input,select{width:100%;padding:13px 14px;border:1.5px solid #d1d5db;border-radius:12px;font-family:inherit;font-size:15px;font-weight:400;background:#fff;color:#1f2937;transition:border-color .15s,box-shadow .15s}
input::placeholder{font-family:inherit;font-size:15px;font-weight:400;color:#9ca3af;opacity:1}
select{font-family:inherit}
input:focus,select:focus{outline:none;border-color:#0f766e;box-shadow:0 0 0 4px rgba(15,118,110,.15)}
select:disabled{background:#f3f4f6;color:#9ca3af}
.kepala-baris{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.rekening{display:inline-block;background:#fff;color:#065f46;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.20)}
.rekening b{letter-spacing:.3px}
.btn-salin{background:#065f46;color:#fff;border:0;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;margin-left:6px;cursor:pointer}
button{background:linear-gradient(180deg,#f97316,#ea580c);color:#fff;border:0;border-radius:14px;padding:15px 20px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;margin-top:24px;width:100%;box-shadow:0 6px 18px rgba(234,88,12,.35)}
button:disabled{opacity:.5;box-shadow:none}
.pesan{margin-top:14px;font-size:14px;padding:12px;border-radius:10px;display:none}
.ok{background:#dcfce7;border:1px solid #86efac} .galat{background:#fee2e2;border:1px solid #fca5a5}
.kecil{font-size:13px;font-weight:400;color:#475569;margin:8px 0 0;line-height:1.5}
.kaki{font-size:13px;font-weight:400;color:#475569;text-align:center;margin:18px 0 0}
.harga{background:#ecfdf5;border:1.5px solid #a7f3d0;border-radius:14px;padding:14px 16px;margin-top:14px;font-size:14px;font-weight:400;line-height:1.5;color:#1f2937}
.harga b{color:#065f46}
#infoBiaya{font-size:14px;color:#065f46;font-weight:700}
@media(max-width:480px){.kepala h1{font-size:19px}.isi{padding:8px 18px 18px}}
</style>
</head>
<body>
<div class="kartu"><div class="kepala"><h1>📋 Form Pemesanan Aplikasi Kelana</h1><div class="kepala-baris"><span class="lencana">✓ Satu sekolah satu lisensi &nbsp;•&nbsp; Donasi seikhlasnya</span><span class="rekening">💳 Donasi: Bank BRI an Wartam — <b id="norek">678801003729530</b> <button type="button" class="btn-salin" onclick="salinRekening(this)">Salin</button></span></div></div><div class="isi">
<h2>🏫 Data Sekolah</h2>
<label>🏫 Nama Sekolah *</label>
<input id="sekolah" placeholder="Contoh: SMP Negeri 4 Majenang">
<h2>🗺️ Wilayah Sekolah</h2>
<label>🗺️ Provinsi *</label><select id="provinsi"><option value="">— Memuat… —</option></select>
<label>🏙️ Kabupaten / Kota *</label><select id="kabupaten" disabled><option value="">— Pilih provinsi dulu —</option></select>
<input id="kabupatenLain" placeholder="Tulis kabupaten/kota (bila pilih Lainnya)" style="display:none;margin-top:8px">
<label>📍 Kecamatan *</label><select id="kecamatan" disabled><option value="">— Pilih kabupaten dulu —</option></select>
<input id="kecamatanLain" placeholder="Tulis kecamatan (bila pilih Lainnya)" style="display:none;margin-top:8px">
<h2>📞 Kontak &amp; Pembayaran</h2>
<label>✉️ Email *</label><input id="email" type="email" placeholder="Contoh: sekolah@example.com">
<label>📱 Kontak WA *</label><input id="wa" placeholder="Contoh: 081234567890">
<label>💻 Jumlah Perangkat (Laptop/PID) yang Menjalankan KELANA *</label><input id="jumlah" type="number" min="1" placeholder="Contoh: 3">
<label>💰 Nominal Donasi (Rp) *</label><input id="nominal" type="number" min="0" placeholder="Contoh: 100000">
<label>🧾 Tautan Bukti Transfer *</label><input id="bukti" placeholder="Contoh: https://drive.google.com/... (tautan foto bukti transfer yang diunggah sekolah sendiri)">

<button id="kirim" onclick="kirim()">📨 Kirim Permintaan</button>
<div id="pesan" class="pesan"></div>

<p class="kaki">Dikembangkan oleh Wartam, S.Pd., SMP Negeri 4 Majenang</p>
</div></div>
<script>
var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxjM1XMueiJ9NcVrHqacX2XGillRmZBUGDLMJWvO-5s4cA5gl4BEkp1TMQolfI3Rt2RQA/exec';
var LAIN = '__lainnya__';
var petaWilayah = {};

function salinRekening(btn) {
  var norek = document.getElementById('norek').textContent.trim();
  function ok() { var lama = btn.textContent; btn.textContent = '✓ Tersalin'; setTimeout(function () { btn.textContent = lama; }, 2000); }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(norek).then(ok, function () {}); }
  else { var t = document.createElement('textarea'); t.value = norek; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) {} document.body.removeChild(t); }
}
function tampilPesan(teks, ok) {
  var p = document.getElementById('pesan'); p.textContent = teks;
  p.className = 'pesan ' + (ok ? 'ok' : 'galat'); p.style.display = 'block';
}

// Panggil backend Apps Script lewat JSONP (tag <script>), supaya bisa
// jalan dari berkas statis tanpa masalah CORS.
function jsonp(params, sukses, gagal) {
  if (WEBAPP_URL.indexOf('XXXX') !== -1) {
    tampilPesan('Form ini belum dihubungkan ke server: isi WEBAPP_URL di index.html dengan URL Web app dari Apps Script.', false);
    return;
  }
  var unik = 'cb' + Date.now() + Math.floor(Math.random() * 10000);
  var s = document.createElement('script');
  var timer = setTimeout(function () {
    if (window[unik]) {
      delete window[unik]; s.remove();
      (gagal || tampilPesan)('Server tidak merespons. Coba lagi beberapa saat.', false);
    }
  }, 30000);
  window[unik] = function (data) {
    try { sukses(data); } finally { clearTimeout(timer); delete window[unik]; s.remove(); }
  };
  s.onerror = function () {
    clearTimeout(timer); delete window[unik];
    (gagal || tampilPesan)('Gagal menghubungi server. Periksa koneksi lalu coba lagi.', false);
  };
  var qs = Object.keys(params).map(function (k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  s.src = WEBAPP_URL + '?callback=' + unik + '&' + qs;
  document.body.appendChild(s);
}

function isiSelect(id, daftar, teksAwal, pakaiLainnya) {
  var s = document.getElementById(id); s.innerHTML = '';
  var o0 = document.createElement('option'); o0.value = ''; o0.textContent = teksAwal; s.appendChild(o0);
  daftar.forEach(function (x) { var o = document.createElement('option'); o.value = x; o.textContent = x; s.appendChild(o); });
  if (pakaiLainnya) { var oL = document.createElement('option'); oL.value = LAIN; oL.textContent = 'Lainnya (ketik manual)'; s.appendChild(oL); }
  s.disabled = false;
}

function pakaiBundle(prov) {
  isiSelect('kabupaten', petaWilayah[prov].kabupaten, '— Pilih Kabupaten / Kota —', true);
}

function muatProvinsi(percobaan) {
  jsonp({ action: 'provinsi' }, function (daftar) {
    if (!daftar || !daftar.length) {
      if (percobaan < 3) { setTimeout(function () { muatProvinsi(percobaan + 1); }, 2000); }
      else { tampilPesan('Gagal memuat daftar provinsi. Periksa koneksi, lalu muat ulang halaman.', false); }
      return;
    }
    isiSelect('provinsi', daftar, '— Pilih Provinsi —', false);
  }, function () {
    if (percobaan < 3) { setTimeout(function () { muatProvinsi(percobaan + 1); }, 2000); }
    else { tampilPesan('Gagal memuat daftar provinsi. Periksa koneksi, lalu muat ulang halaman.', false); }
  });
}
muatProvinsi(1);

document.getElementById('provinsi').addEventListener('change', function () {
  var prov = this.value;
  document.getElementById('kabupatenLain').style.display = 'none';
  document.getElementById('kecamatanLain').style.display = 'none';
  var kec = document.getElementById('kecamatan'); kec.innerHTML = ''; kec.disabled = true;
  var kab = document.getElementById('kabupaten'); kab.innerHTML = ''; kab.disabled = true;
  if (!prov) { return; }
  if (petaWilayah[prov]) { pakaiBundle(prov); return; }
  jsonp({ action: 'wilayah', prov: prov }, function (b) {
    if (!b || !b.kabupaten) {
      tampilPesan('Server belum diperbarui: redeploy Code.gs sebagai New version (lihat PANDUAN), lalu coba lagi.', false);
      return;
    }
    petaWilayah[prov] = b;
    pakaiBundle(prov);
  });
});

document.getElementById('kabupaten').addEventListener('change', function () {
  var prov = document.getElementById('provinsi').value;
  var kab = this.value;
  document.getElementById('kabupatenLain').style.display = (kab === LAIN) ? 'block' : 'none';
  var kec = document.getElementById('kecamatan'); kec.innerHTML = '';
  if (kab === LAIN) { kec.disabled = true; document.getElementById('kecamatanLain').style.display = 'block'; return; }
  document.getElementById('kecamatanLain').style.display = 'none';
  if (!kab) { kec.disabled = true; return; }
  var daftar = (petaWilayah[prov] && petaWilayah[prov].kecamatan[kab]) || [];
  isiSelect('kecamatan', daftar, '— Pilih Kecamatan —', true);
});


document.getElementById('kecamatan').addEventListener('change', function () {
  document.getElementById('kecamatanLain').style.display = (this.value === LAIN) ? 'block' : 'none';
});

function nilai(id) { return document.getElementById(id).value.trim(); }

function kirim() {
  var kabSel = nilai('kabupaten');
  var kab = (kabSel === LAIN) ? nilai('kabupatenLain') : kabSel;
  var kecSel = nilai('kecamatan');
  var kec = (kabSel === LAIN || kecSel === LAIN) ? nilai('kecamatanLain') : kecSel;
  var data = { sekolah: nilai('sekolah'), prov: nilai('provinsi'),
    kab: kab, kec: kec, email: nilai('email'), wa: nilai('wa'),
    jumlah: nilai('jumlah'), bukti: nilai('bukti'), nominal: nilai('nominal') };
  if (!data.sekolah || !data.prov || !data.kab || !data.kec || !data.email || !data.wa || !data.jumlah || !data.nominal) {
    tampilPesan('Mohon lengkapi semua field yang bertanda *.', false); return; }
  if (parseInt(data.jumlah, 10) < 1) { tampilPesan('Jumlah perangkat minimal 1.', false); return; }
  if (parseInt(data.nominal, 10) < 0) { tampilPesan('Nominal donasi tidak boleh negatif.', false); return; }
  if (parseInt(data.nominal, 10) > 0 && data.bukti.indexOf('http') !== 0) { tampilPesan('Tautan bukti transfer belum benar (harus diawali http).', false); return; }
  if (!/^\S+@\S+\.\S+$/.test(data.email)) { tampilPesan('Format email belum benar.', false); return; }
  var tombol = document.getElementById('kirim'); tombol.disabled = true; tombol.textContent = 'Mengirim…';
  var params = { action: 'kirim', sekolah: data.sekolah, prov: data.prov,
    kab: data.kab, kec: data.kec, email: data.email, wa: data.wa,
    jumlah: data.jumlah, bukti: data.bukti, nominal: data.nominal };
  jsonp(params, function (r) {
    tombol.disabled = false; tombol.textContent = '📨 Kirim Permintaan';
    tampilPesan(r.pesan, r.ok);
  }, function () {
    tombol.disabled = false; tombol.textContent = '📨 Kirim Permintaan';
    tampilPesan('Gagal mengirim. Coba lagi beberapa saat.', false);
  });
}
</script>
</body>
</html>
